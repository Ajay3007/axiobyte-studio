[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiobyte-studio"
version = "0.1.0"
description = "A systems visualization framework — turning computer-science ideas into the images that make them unavoidable."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ajay Gupt", email = "ajaymaddheshiya33@gmail.com" }]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
manim = ["manim>=0.18"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-PyYAML",
]

[project.scripts]
abs = "axiobyte_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/axiobyte_studio"]

# ---------------------------------------------------------------------------
# Style — CONVENTIONS.md §1
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "D", "RUF", "SIM", "TID"]
ignore = [
    "D107",  # __init__ documented on the class
    "D203", "D213",  # mutually exclusive with the chosen docstring style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Types — CONVENTIONS.md §1
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/axiobyte_studio"]
exclude = ["backends/blender/scripts/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Manim ships partial type information: `camera.frame` is typed as a union that
# does not narrow for MovingCameraScene, and several constructors are untyped.
# The relaxation is scoped to the backend that touches Manim and nowhere else —
# which is the point of confining the tool to one package in the first place.
# Runs inside Blender, where `bpy` exists. It is a script executed by
# `blender --python`, never imported by the Studio.
[[tool.mypy.overrides]]
module = ["axiobyte_studio.backends.blender.scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["axiobyte_studio.backends.manim.*"]
disable_error_code = ["union-attr", "no-untyped-call"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "reference: runs against the reference episodes; skipped when they are absent",
    "blender: needs Blender installed; skipped when it is not",
]

# ---------------------------------------------------------------------------
# Import contracts — CONVENTIONS.md §2. These are the load-bearing rules of the
# architecture; without them the layering rots within months.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "axiobyte_studio"
include_external_packages = true

# NOTE: contracts list only modules that exist. Extend each list in the same commit
# that adds a subsystem — a contract added later is a contract that arrives after the
# violation it was meant to prevent.

[[tool.importlinter.contracts]]
name = "1. Rendering tools are confined to backends/"
type = "forbidden"
source_modules = [
    "axiobyte_studio.core",
    "axiobyte_studio.design",
    "axiobyte_studio.timeline",
    "axiobyte_studio.layout",
    "axiobyte_studio.typography",
    "axiobyte_studio.chrome",
    "axiobyte_studio.motion",
    "axiobyte_studio.concepts",
    "axiobyte_studio.storyboard",
    "axiobyte_studio.actors",
    "axiobyte_studio.actions",
    "axiobyte_studio.compose",
]
forbidden_modules = ["manim", "bpy"]

[[tool.importlinter.contracts]]
name = "2. core/ imports nothing from the rest of the engine"
type = "forbidden"
source_modules = ["axiobyte_studio.core"]
forbidden_modules = [
    "axiobyte_studio.compose",
    "axiobyte_studio.render",
    "axiobyte_studio.backends",
    "axiobyte_studio.design",
    "axiobyte_studio.timeline",
    "axiobyte_studio.layout",
    "axiobyte_studio.typography",
    "axiobyte_studio.chrome",
    "axiobyte_studio.motion",
    "axiobyte_studio.concepts",
    "axiobyte_studio.storyboard",
    "axiobyte_studio.actors",
    "axiobyte_studio.actions",
]

[[tool.importlinter.contracts]]
name = "3. The layer stack is one-directional"
type = "layers"
layers = [
    "axiobyte_studio.compose",
    "axiobyte_studio.render",
    "axiobyte_studio.backends",
    "axiobyte_studio.actions",
    "axiobyte_studio.actors",
    "axiobyte_studio.storyboard",
    "axiobyte_studio.chrome",
    "axiobyte_studio.typography",
    "axiobyte_studio.layout",
    "axiobyte_studio.concepts",
    "axiobyte_studio.motion",
    "axiobyte_studio.design",
    "axiobyte_studio.timeline",
    "axiobyte_studio.core",
]
