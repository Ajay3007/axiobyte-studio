<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>NIC Video · AxioByte</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="video-body">
    <!-- 1920x1080 composition. The WebGL canvas renders into #render-host and
         is composited into #out; only #out is ever captured. -->
    <div id="viewport-wrap">
      <div id="stage">
        <div id="render-host"></div>
        <div id="out-host"></div>
      </div>
    </div>
    <!-- The supplied voiceover.mpeg is an MPEG program stream, which <audio>
         cannot decode. `npm run audio` stream-copies the MP3 out of it; the
         renderer still feeds ffmpeg the original .mpeg. -->
    <audio id="voiceover" src="/content/nic/voiceover.mp3" preload="auto"></audio>
    <div id="hud-root"></div>
    <div id="video-fallback" hidden>
      <h2>WebGL 2 required</h2>
      <p>This page renders the 3D NIC. Enable hardware acceleration and reload.</p>
    </div>
    <script type="module" src="./src/video-main.js"></script>
  </body>
</html>
