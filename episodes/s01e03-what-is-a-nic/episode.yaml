id: s01e03-what-is-a-nic
title: "What Is a NIC?"
pillar: p01-high-performance-data-plane

# The Three.js backend renders this film at 1920x1080. Its overlay is laid out in
# absolute 16:9 pixels, so 16x9 is the only target it can honestly declare.
targets: [16x9]
theme: systems

# Shots render on the Three.js backend unless storyboard/shots.yaml says
# otherwise, shot by shot (ARCHITECTURE.md §8.0a). The same scene is the
# interactive page at experiences/networking/nic/.
renderer: three

# What the audience is declared to already know.
assumed: [packet, cpu, memory_buffer, worker_core, interrupt_driven, mbuf]

# THE ONE RULE: every beat is a word start in this transcript. timeline.json is the
# creator-supplied timing for the canonical recording below, kept byte-for-byte as delivered.
voiceover: "timeline/timeline.json"

# The recording itself is a local input and is never committed (.gitignore):
# timing comes from timeline.json above. Only `abs compose` needs the audio, and it
# refuses a file whose hash is not this one. The timeline was transcribed from an
# earlier encode of the same take (its meta names voiceover.mpeg); this mp3 runs a
# constant 12 ms ahead of it — accepted by the creator as within tolerance.
audio:
  path: "audio/voiceover.mp3"
  sha256: 4d829597c5e2af7184b7eed19ccbf1ba910f92a5e9c4312642178eba8c1da8d3
  duration: 718.00

# Seconds of picture after the last word, so the end card is not cut mid-word.
tail: 1.5
