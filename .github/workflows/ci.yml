name: CI
on: [push, pull_request]

jobs:
  check:
    strategy:
      # Windows is a peer, not an afterthought: the Studio is developed on more
      # than one machine, and a portability break is cheapest to find on the
      # commit that caused it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # manimpango builds from source on Linux and needs pango's headers. macOS
      # and Windows get wheels. Same packages SETUP.md §4.5 asks Linux users for.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev
      # `[manim]` too: mypy type-checks the Manim backend, and without Manim
      # installed CI sees a different codebase than the developer does.
      - run: pip install -e ".[dev,manim]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Import contracts
        run: lint-imports
      - name: Tests
        run: pytest
