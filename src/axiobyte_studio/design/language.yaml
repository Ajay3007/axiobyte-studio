# THE VISUAL LANGUAGE REGISTRY  —  ATOMIC CONCEPTS ONLY
#
# This file answers "what does this thing LOOK LIKE", and only atomic concepts have
# an answer. A packet has a silhouette; an mbuf has a silhouette; ZERO-COPY does not,
# because a relationship cannot be drawn — it reaches the screen through its
# participants. Interaction and composite concepts live in concepts/library/.
#
# `dma` used to be registered here with a beam silhouette. The beam is not DMA; it is
# how the TRANSFER BETWEEN a NIC and memory is drawn, which belongs to the dma
# interaction's motion_grammar. Leaving it here would let a relationship acquire a
# silhouette, and the next episode would treat DMA as an object.
#
# Concepts own roles. This file is THEME-INDEPENDENT: it says a packet is drawn in
# the `packet` role and moves with an ease-out; it never says what colour that is.
# Values live in design/themes/*.yaml.
#
# This is ep02's docstring rule — "one hue per idea, and nothing borrows a hue it
# does not own" — turned from prose into something CI can enforce.
#
# `never:` entries are lint-enforced negative space. They exist because the failure
# mode of a visual language is not a bad decision; it is a hundred small drifts,
# each individually defensible.

version: 1.0.0

concepts:

  packet:
    role: packet
    silhouette: byte_cells        # individual cells, so a copy has something to move
    motion: packet.travel         # ease-out; never linear, never instant
    label: { style: mono_s, position: above }
    states:
      in_flight: glow.soft
      at_rest: none
      dropped: desaturate_and_fall
      frozen: outline_dashed
    never:
      - any role but `packet`
      - a single undivided block      # then a copy has nothing to move, and the point dies

  memory_buffer:
    role: memory
    silhouette: framed_region        # a purple frame HOLDING blue payload
    motion: none                     # memory does not travel. Ever.
    label: { style: mono_s, position: above }
    never:
      - travelling
      - containing anything but payload or emptiness

  mempool:
    role: memory
    silhouette: slot_grid            # many identical preallocated buffers
    motion: allocate.ripple
    never:
      - showing fewer than 4 slots    # "pool" must read as plural at a glance

  mbuf:
    role: mbuf
    silhouette: metadata_card        # fields, with buf_addr as the load-bearing one
    motion: pointer.snap             # the mbuf travels like what it is: a handle
    never:
      - containing the payload bytes  # the whole misconception ZC-M3

  pointer:
    role: pointer
    silhouette: thin_arrow
    motion: pointer.snap             # pointers snap; they do not glide
    signature: glow.pulse.slow       # what viewers learn to recognise
    never:
      - carrying bytes with it        # a pointer that moves payload is a lie
      - curved paths                  # a pointer is an address, not a journey

  nic:
    role: nic
    silhouette: board                # flat, isometric or plate, by fidelity
    motion: none
    fidelity: [flat, iso, plate]     # see ARCHITECTURE.md §8.0 — the three 3D tiers

  cpu:
    role: cpu
    silhouette: die_with_cores
    motion: none
    fidelity: [flat, iso, plate]

  cache_line:
    role: memory
    silhouette: line_cells          # 64 bytes, drawn as cells, so two variables
    motion: none                    #   can visibly land on the SAME line
    fidelity: [flat, iso]
    never:
      - being drawn as a single undivided block

  thread:
    role: cpu
    silhouette: lane
    motion: poll.metronome
    states:
      running: glow.soft
      blocked: outline_dashed
      ready: none
    never:
      - sharing a lane with another thread

  worker_core:
    role: cpu
    silhouette: die_with_cores
    motion: none
    fidelity: [flat, iso]

  nic_queue:
    role: nic
    silhouette: slot_grid
    motion: none

  # The NIC's own parts (s01e03). They are hardware on the card, so they draw in
  # the card's role; what distinguishes them is silhouette and label, never hue.
  phy:
    role: nic
    silhouette: board
    motion: none
    fidelity: [flat, plate]

  magnetics:
    role: nic
    silhouette: board
    motion: none
    fidelity: [flat, plate]
    never:
      - amplifying the signal       # they isolate; MAG-1 exists to refute exactly this

  pcie:
    role: nic
    silhouette: board
    motion: none
    fidelity: [flat, plate]
    never:
      - a second path to memory      # it is the card's ONLY road to the host

  # Host memory, prepared by software — memory's role, not the card's, even though
  # the NIC reads and writes it.
  descriptor_ring:
    role: memory
    silhouette: slot_grid
    motion: none
    never:
      - holding the packet bytes     # a descriptor points at a buffer; it is not one

  # Host memory as a whole: the modules, and the address space software allocates rings and
  # buffers in. Memory's role, like everything allocated in it.
  host_memory:
    role: memory
    silhouette: address_map          # regions laid out along an address axis
    motion: none                     # memory does not travel
    fidelity: [flat]
    never:
      - rings or buffers on the card # the v1.1 lesson: they are allocated here, in DRAM

  # dma      -> concepts/library/interaction/dma.yaml         (nic <-> memory_buffer)
  # copy     -> concepts/library/interaction/copy_based.yaml  (packet <-> memory_buffer)
  # Their ROLES remain in design/themes/, because a role is a value and an
  # interaction still needs one to render its participants with.
